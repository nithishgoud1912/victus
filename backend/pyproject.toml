[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victus-assistant"
version = "0.1.0"
description = "Local first VICTUS execution foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph==1.2.15",
  "langgraph-checkpoint-sqlite==3.1.2",
  "playwright>=1.64.0",
  "pydantic>=2.9,<3",
  "pywinauto>=0.6.9",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]
packaging = ["pyinstaller==6.22.3", "pillow==12.2.0"]

[project.scripts]
victus = "victus.cli:main"

[project.optional-dependencies]
wake = [
    "openwakeword==0.6.0; platform_system == 'Windows' and python_version >= '3.12'",
    "numpy==2.5.4; platform_system == 'Windows' and python_version >= '3.12'",
    "onnxruntime==1.31.0; platform_system == 'Windows' and python_version >= '3.12'",
    "scipy==1.18.1; platform_system == 'Windows' and python_version >= '3.12'",
    "scikit-learn==1.9.1; platform_system == 'Windows' and python_version >= '3.12'",
    "requests==2.34.2; platform_system == 'Windows' and python_version >= '3.12'",
    "tqdm==4.70.1; platform_system == 'Windows' and python_version >= '3.12'",
]
mcp = ["pywin32==312; platform_system == 'Windows'"]
voice = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "pywin32>=312",
    "sounddevice>=0.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["victus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
